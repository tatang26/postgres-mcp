name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "bin/postgres-mcp${ext}" ./cmd/postgres-mcp

      - name: Package archive
        id: package
        run: |
          archive="postgres-mcp-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "${archive}.zip" bin/postgres-mcp.exe
            echo "asset=${archive}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${archive}.tar.gz" -C bin postgres-mcp
            echo "asset=${archive}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename binary for release
        id: binary
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          bin="postgres-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          cp "bin/postgres-mcp${ext}" "bin/${bin}"
          echo "asset=${bin}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.binary.outputs.asset }}
          path: bin/${{ steps.binary.outputs.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
